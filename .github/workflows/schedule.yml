
name: Update International Match Schedule

on:
  schedule:
    # Daily at 1:00 AM Pakistan time (20:00 UTC)
    - cron: '0 20 * * *'
  workflow_dispatch:

concurrency:
  group: schedule-ultra-final
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Puppeteer
        run: npm install puppeteer --no-save --no-package-lock --no-audit --no-fund

      - name: Run Daily Scraper
        run: node scraper.js --mode=daily

      - name: Verify JSON files
        run: |
          node -e "
          const fs = require('fs');

          const files = [
            'match-schedule.json',
            'match-teams.json',
            'players.json'
          ];

          for (const file of files) {
            if (!fs.existsSync(file)) {
              throw new Error(file + ' is missing');
            }

            const data = JSON.parse(fs.readFileSync(file, 'utf8'));

            console.log(file + ': OK');

            if (file === 'match-schedule.json') {
              if (!Array.isArray(data) || data.length === 0) {
                throw new Error('Schedule is empty or invalid');
              }

              const ids = data.map(match => String(match.id));

              if (new Set(ids).size !== ids.length) {
                throw new Error('Duplicate match IDs found');
              }

              console.log('Fixtures:', data.length);
            }
          }
          "

      - name: Commit updated JSON files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'

          git add match-schedule.json match-teams.json players.json

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Daily cricket data update"

          # Latest GitHub changes ko safely include karo
          git fetch origin main
          git rebase origin/main

          # Force push bilkul nahi karna
          git push origin HEAD:main
