name: Update International Match Schedule
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: browser-actions/setup-chrome@v1
      - run: npm install puppeteer-core@21.6.1 --no-save --no-audit --no-fund
      - run: node scraper.js
      - run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add match-schedule.json
          git stash --keep-index --include-untracked || true
          git pull --rebase origin main || true
          git stash pop || true
          git add match-schedule.json
          git diff --staged --quiet || git commit -m "Update Schedule - $(date -u)"
          git push || (git pull --rebase origin main && git push)
