
name: Update International Match Schedule

on:
  workflow_dispatch:

concurrency:
  group: schedule-ultra-final
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Puppeteer
        run: npm install puppeteer --no-save --no-package-lock --no-audit --no-fund

      - name: Run Daily Scraper
        run: node scraper.js --mode=daily

      - name: Verify JSON files
        run: |
          node -e "
          const fs = require('fs');
          for (const file of ['match-schedule.json','match-teams.json','players.json']) {
            const data = JSON.parse(fs.readFileSync(file, 'utf8'));
            console.log(file, 'OK');
          }
          "

      - name: Commit updated JSON files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'

          git add match-schedule.json match-teams.json players.json

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Daily cricket data update"
            git push origin HEAD:main
          fi
