name: Update International Match Schedule
on:
  schedule:
    - cron: '0 */6 * * * *'
  workflow_dispatch:
concurrency:
  group: schedule-ultra-final
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: browser-actions/setup-chrome@v1
      - run: npm install puppeteer-core@21.6.1 --no-save --no-audit --no-fund
      - name: Run Schedule Scraper
        run: |
          node scraper.js
          echo "=== SCHEDULE ==="
          cat match-schedule.json | head -50
      - name: FORCE PUSH - NO REBASE NO CONFLICT
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          rm -rf node_modules
          echo "node_modules/" > .gitignore
          git add -f match-schedule.json .gitignore || true
          git commit -m "Schedule $(date -u)" || echo "nothing to commit"
          git push --force origin main || git push -f origin main || true
