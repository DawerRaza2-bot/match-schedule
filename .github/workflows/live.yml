name: Update Live Score - International
on:
  schedule:
    - cron: '*/3 * * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: browser-actions/setup-chrome@v1
      - run: npm install puppeteer-core@21.6.1 --no-save --no-audit --no-fund
      - run: node Live-Scraper.js || node live-scraper.js || node Live-Scraper-FIXED-CHROME.js
      - run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          rm -rf node_modules/
          git add live-data.json
          git stash --keep-index --include-untracked || true
          git pull --rebase origin main || true
          git stash pop || true
          if git diff --name-only --diff-filter=U | grep -q "live-data.json"; then
            git checkout --theirs live-data.json || git checkout --ours live-data.json
            git add live-data.json
          fi
          git diff --staged --quiet || git commit -m "Update Live - $(date -u)"
          git push || (git pull --rebase origin main && git push)
