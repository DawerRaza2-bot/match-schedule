name: Update Live Score - International
on:
  schedule:
    - cron: '*/3 * * * *'
  workflow_dispatch:
concurrency:
  group: live-ultra-final
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: browser-actions/setup-chrome@v1
      - run: npm install puppeteer-core@21.6.1 --no-save --no-audit --no-fund
      - name: Run Live Scraper
        run: |
          node Live-Scraper-ULTRA-FIXED.js 2>&1 || node Live-Scraper-FIXED-CHROME.js 2>&1 || node live-scraper.js 2>&1 || node Live-Scraper.js 2>&1
          echo "=== LIVE DATA ==="
          cat live-data.json | head -50
      - name: FORCE PUSH - NO REBASE NO CONFLICT
        run: |
          git config --global user.name '【entity-github¦canonical_name=GitHub】-actions[bot]'
          git config --global user.email '【entity-github¦canonical_name=GitHub】-actions[bot]@users.noreply.【entity-github¦canonical_name=GitHub】.com'
          rm -rf node_modules
          echo "node_modules/" > .gitignore
          git add -f live-data.json .gitignore || true
          git commit -m "Live $(date -u)" || echo "nothing to commit"
          git push --force origin main || git push -f origin main || true
