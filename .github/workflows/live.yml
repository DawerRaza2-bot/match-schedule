
name: Update Live Score - International

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

concurrency:
  group: live-ultra-final
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Chrome
        uses: browser-actions/setup-chrome@v1

      - name: Install Puppeteer Core
        run: npm install puppeteer-core@21.6.1 --no-save --no-package-lock --no-audit --no-fund

      - name: Run Live Scraper
        run: node Live-Scraper.js

      - name: Verify Live JSON
        run: |
          node -e "
          const fs = require('fs');

          if (!fs.existsSync('live-data.json')) {
            throw new Error('live-data.json is missing');
          }

          const data = JSON.parse(
            fs.readFileSync('live-data.json', 'utf8')
          );

          console.log('live-data.json: OK');
          console.log('JSON verification successful');
          "

      - name: Commit Live Data Safely
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'

          git add live-data.json

          if git diff --cached --quiet; then
            echo "No live data changes."
            exit 0
          fi

          git commit -m "Update live cricket scores"

          git fetch origin main
          git rebase origin/main

          git push origin HEAD:main
