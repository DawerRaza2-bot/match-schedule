name: Update Live Score - International

on:
  schedule:
    - cron: '*/3 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Setup Chrome
        uses: browser-actions/setup-chrome@v1
      
      - name: Install Puppeteer Core
        run: npm install puppeteer-core@21.6.1 --no-save --no-audit --no-fund
      
      - name: Run Live Scraper (International Only)
        run: node Live-Scraper.js
      
      - name: Commit and Push live-data.json
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add live-data.json
          git stash --keep-index --include-untracked || true
          git pull --rebase origin main || true
          git stash pop || true
          git add live-data.json
          git diff --staged --quiet || git commit -m "Update Live - $(date -u) - Count 0 or Live International"
          git push || (git pull --rebase origin main && git push)
