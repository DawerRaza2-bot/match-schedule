name: Update International Match Schedule

on:
  schedule:
    - cron: '0 0 25 * *'  # Har mahine ki 25 tareekh ko raat 12 baje
  workflow_dispatch:  # Manual bhi chala sakte ho kabhi bhi

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Chrome
        uses: browser-actions/setup-chrome@latest

      - name: Install Puppeteer Core only
        run: npm install puppeteer-core@21.6.1 --no-save --no-audit --no-fund

      - name: Run scraper (Full Month - 10 Pages)
        run: node scraper.js

      - name: Commit and Push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add match-schedule.json
          git diff --staged --quiet || git commit -m "Update Monthly schedule (25th) - $(date -u)"
          git push
