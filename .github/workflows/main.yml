name: Update International Match Schedule

on:
  schedule:
    - cron: '0 */10 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Chrome
        uses: browser-actions/setup-chrome@latest

      - name: Install Puppeteer Core only
        run: npm install puppeteer-core@21.6.1 --no-save --no-audit --no-fund

      - name: Run scraper
        run: node scraper.js

      - name: Commit and Push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add match-schedule.json
          git diff --staged --quiet || git commit -m "Update International schedule - $(date -u)"
          git push
