name: Update International Match Schedule

on:
  schedule:
    - cron: '0 */10 * * *'
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Chrome
        uses: browser-actions/setup-chrome@latest
      - name: Install Puppeteer Core only
        run: npm install puppeteer-core@21.6.1 --no-save --no-audit --no-fund
      - name: Run scraper
        run: node scraper.js
      - name: Commit
        run: |
          git config --global user.name "bot"
          git config --global user.email "bot@bot.com"
          git add match-schedule.json
          git diff --staged --quiet || git commit -m "Update"
          git push
