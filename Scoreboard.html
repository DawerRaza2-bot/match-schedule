<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>iOS Broadcast Scoreboard - Cloudflare Live</title>
<link href="https://fonts.googleapis.com/css2?family=Teko:wght@600;700&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", Arial, sans-serif; -webkit-font-smoothing: antialiased; }
body { background: transparent; height: 100vh; overflow: hidden; position: relative; }
.broadcast-bar { width: 100vw; height: 120px; position: absolute; top: 0; left: 0; background: linear-gradient(90deg, rgba(10,25,47,0.92) 0%, rgba(15,23,42,0.96) 50%, rgba(88,28,28,0.92) 100%); backdrop-filter: blur(25px); border-bottom: 1.5px solid rgba(255,255,255,0.15); display: grid; grid-template-columns: 28% 44% 28%; align-items: center; box-shadow: 0 15px 35px rgba(0,0,0,0.8); z-index: 100; padding: 0 25px; }
.team-side { display: flex; align-items: center; gap: 15px; } .team-side.right { justify-content: flex-end; }
.flag-name-wrapper { display: flex; flex-direction: column; align-items: center; }
.team-code { font-size: 14px; font-weight: 800; text-transform: uppercase; color: #38bdf8; letter-spacing: 1px; margin-bottom: 4px; text-align: center; text-shadow: 0 2px 6px rgba(0,0,0,0.9); }
.flag-img { width: 62px; height: 62px; border-radius: 50%; object-fit: cover; border: 2.5px solid #fff; box-shadow: 0 6px 18px rgba(0,0,0,0.7); background: #111; }
.team-info { display: flex; flex-direction: column; justify-content: center; }
.team-side.right .team-info { align-items: flex-end; text-align: right; }
.team-role { font-size: 11px; font-weight: 900; color: #ffcc00; text-transform: uppercase; letter-spacing: 1.5px; margin-bottom: 2px; text-shadow: 0 2px 6px rgba(0,0,0,0.9); }
.score-row { display: flex; align-items: baseline; gap: 8px; }
.team-side.right .score-row { justify-content: flex-end; gap: 16px; }
.score-val { font-family: 'Teko', sans-serif; font-size: 46px; line-height: 0.9; font-weight: 700; color: #fff; text-shadow: 0 3px 10px rgba(0,0,0,0.8); }
.stat-group { display: flex; flex-direction: column; align-items: flex-end; }
.stat-label { font-size: 11px; font-weight: 800; color: #ffcc00; letter-spacing: 1.2px; text-transform: uppercase; }
.stat-value { font-family: 'Teko', sans-serif; font-size: 42px; line-height: 0.9; font-weight: 700; color: #fff; }
.center-box { text-align: center; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 0 10px; }
.matchup-tag { font-size: 22px; font-weight: 800; color: #fff; text-transform: uppercase; letter-spacing: 2px; text-shadow: 0 2px 10px rgba(0,0,0,0.9); max-width: 520px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.series-tag { font-size: 15px; font-weight: 800; color: #ffcc00; text-transform: uppercase; margin-top: 3px; text-shadow: 0 2px 8px rgba(0,0,0,0.9); max-width: 550px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.center-mid-ios-card { position: absolute; top: 45vh; left: 50%; transform: translate(-50%, -50%); width: 85vw; max-width: 1000px; background: transparent; backdrop-filter: blur(12px); padding: 10px 20px; text-align: center; z-index: 90; }
.center-mid-ios-text { font-size: 45px; font-weight: 900; color: #ffcc00; text-transform: uppercase; letter-spacing: 2px; text-shadow: 0 4px 20px rgba(0,0,0,0.95), 0 0 30px rgba(255,204,0,0.3); line-height: 1.15; }
.bottom-players-strip { width: 100vw; position: absolute; bottom: 0; left: 0; display: grid; grid-template-columns: 1fr 1fr 1fr; background: rgba(8,12,22,0.95); backdrop-filter: blur(16px); border-top: 3.5px solid #ffcc00; box-shadow: 0 -12px 35px rgba(0,0,0,0.9); z-index: 100; }
.player-section-box { position: relative; padding: 10px 15px 10px 150px; display: flex; flex-direction: column; justify-content: space-between; height: 145px; border-right: 1.5px solid rgba(255,255,255,0.15); overflow: visible; }
.player-section-box:last-child { border-right: none; }
.batting-theme-1, .batting-theme-2 { background: linear-gradient(180deg, rgba(10,37,64,0.9) 0%, rgba(19,57,99,0.95) 100%); }
.bowling-theme { background: linear-gradient(180deg, rgba(92,15,15,0.9) 0%, rgba(138,23,23,0.95) 100%); }
.role-tag-box { position: absolute; top: 8px; right: 16px; background: rgba(255,255,255,0.95); color: #000; font-size: 11px; font-weight: 900; padding: 2px 12px; border-radius: 4px; letter-spacing: 1px; text-transform: uppercase; box-shadow: 0 2px 8px rgba(0,0,0,0.4); z-index: 10; }
.playerProfileDefault { position: absolute; left: 10px; bottom: 0px; width: 130px; height: 160px; z-index: 20; overflow: visible; }
.player-vector { position: absolute; bottom: 0; left: 8px; width: 130px; height: 230px; z-index: 5; object-fit: contain; }
.player-jersey { position: absolute; bottom: 15px; left: 0px; width: 145px; height: 100px; z-index: 15; object-fit: contain; opacity: 0.98; filter: drop-shadow(0 5px 10px rgba(0,0,0,0.6)); }
.card-main-content { display: flex; flex-direction: column; justify-content: center; height: 78px; margin-left: 15px; }
.player-fullname { font-size: 15px; font-weight: 900; color: #fff; letter-spacing: 0.5px; text-transform: uppercase; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-shadow: 0 2px 6px rgba(0,0,0,0.6); margin-bottom: 2px; }
.player-primary-stats { font-family: 'Teko', sans-serif; font-size: 42px; line-height: 0.9; color: #fff; font-weight: 700; text-shadow: 0 2px 6px rgba(0,0,0,0.6); margin-left: 15px; }
.player-primary-stats span.highlight-num { color: #ffcc00; }
.player-sub-stats-bar { display: flex; align-items: center; gap: 15px; font-size: 13px; font-weight: 800; color: #fff; border-top: 1px solid rgba(255,255,255,0.18); padding-top: 4px; margin-top: 2px; text-shadow: 0 1px 4px rgba(0,0,0,0.5); margin-left: 15px; }
.player-sub-stats-bar span.yellow-val { color: #ffcc00; }
#status { position: absolute; top: 130px; left: 10px; background: rgba(0,0,0,0.7); color: #0f0; padding: 5px 10px; border-radius: 5px; font-size: 12px; z-index: 200; }
</style>
</head>
<body>
<div id="status">Loading live data from Cloudflare...</div>
<div class="broadcast-bar">
    <div class="team-side">
        <div class="flag-name-wrapper">
            <span class="team-code" id="t1Code">...</span>
            <img id="t1Flag" class="flag-img" src="" alt="Flag">
        </div>
        <div class="team-info">
            <span class="team-role">BATTING</span>
            <div class="score-row"><span class="score-val" id="t1Score">0/0</span></div>
        </div>
    </div>
    <div class="center-box">
        <span class="matchup-tag" id="matchupTitle">... VS ...</span>
        <span class="series-tag" id="matchSeries">...</span>
    </div>
    <div class="team-side right">
        <div class="score-row">
            <div class="stat-group"><span class="stat-label">OVERS</span><span class="stat-value" id="valOvers">0</span></div>
            <div class="stat-group"><span class="stat-label">BALLS</span><span class="stat-value" id="valBalls">0</span></div>
        </div>
        <div class="flag-name-wrapper">
            <span class="team-code" id="t2Code">...</span>
            <img id="t2Flag" class="flag-img" src="" alt="Flag">
        </div>
    </div>
</div>
<div class="center-mid-ios-card"><div class="center-mid-ios-text" id="centerMidCommentary">...</div></div>
<div class="bottom-players-strip">
    <div class="player-section-box batting-theme-1">
        <div class="role-tag-box">BATSMAN</div>
        <div class="playerProfileDefault"><img id="b1Img" class="player-vector" src="" alt=""><img id="b1Jersey" class="player-jersey" src="" alt=""></div>
        <div class="card-main-content"><div class="player-fullname" id="b1Name">Batter 1</div><div class="player-primary-stats"><span id="b1Runs">0</span> <span class="highlight-num">(<span id="b1Balls">0</span>)</span></div></div>
        <div class="player-sub-stats-bar"><div>4S: <span class="yellow-val" id="b14s">0</span></div><div>6S: <span class="yellow-val" id="b16s">0</span></div><div>SR: <span class="yellow-val" id="b1Sr">0.00</span></div></div>
    </div>
    <div class="player-section-box batting-theme-2">
        <div class="role-tag-box">BATSMAN</div>
        <div class="playerProfileDefault"><img id="b2Img" class="player-vector" src="" alt=""><img id="b2Jersey" class="player-jersey" src="" alt=""></div>
        <div class="card-main-content"><div class="player-fullname" id="b2Name">Batter 2</div><div class="player-primary-stats"><span id="b2Runs">0</span> <span class="highlight-num">(<span id="b2Balls">0</span>)</span></div></div>
        <div class="player-sub-stats-bar"><div>4S: <span class="yellow-val" id="b24s">0</span></div><div>6S: <span class="yellow-val" id="b26s">0</span></div><div>SR: <span class="yellow-val" id="b2Sr">0.00</span></div></div>
    </div>
    <div class="player-section-box bowling-theme">
        <div class="role-tag-box">BOWLER</div>
        <div class="playerProfileDefault"><img id="bowlImg" class="player-vector" src="" alt=""><img id="bowlJersey" class="player-jersey" src="" alt=""></div>
        <div class="card-main-content"><div class="player-fullname" id="bowlName">Bowler</div><div class="player-primary-stats"><span id="bowlFigs">0-0</span> <span class="highlight-num">(<span id="bowlOvs">0.0</span>)</span></div></div>
        <div class="player-sub-stats-bar"><div>ECON: <span class="yellow-val" id="bowlEcon">0.00</span></div></div>
    </div>
</div>
<script>
let currentMatchIndex = 0;
let liveData = null;
async function fetchLiveData() {
    try {
        // Cloudflare + GitHub - Always fresh with cache buster
        const res = await fetch('https://raw.githubusercontent.com/DawerRaza2-bot/match-schedule/main/live-data.json?v=' + Date.now());
        if (!res.ok) throw new Error('No live data');
        const data = await res.json();
        document.getElementById('status').innerText = `Live: ${data.count} matches | Updated: ${new Date(data.updatedAt).toLocaleTimeString()} | Cloudflare Ready`;
        document.getElementById('status').style.background = 'rgba(0,100,0,0.8)';
        liveData = data;
        if (data.matches && data.matches.length > 0) {
            updateUI(data.matches[currentMatchIndex].live, data.matches[currentMatchIndex]);
        } else {
            document.getElementById('status').innerText = 'No Live Matches - Waiting...';
        }
    } catch(e) {
        document.getElementById('status').innerText = 'Error: ' + e.message + ' - Retrying...';
        document.getElementById('status').style.background = 'rgba(100,0,0,0.8)';
    }
}
function updateUI(d, matchMeta) {
    if(!d) return;
    document.getElementById('matchupTitle').innerText = (matchMeta.team1.name + " VS " + matchMeta.team2.name).toUpperCase();
    document.getElementById('matchSeries').innerText = d.series || matchMeta.seriesInfo || "LIVE";
    document.getElementById('t1Code').innerText = d.team1Name || matchMeta.team1.name;
    if(d.team1Flag || matchMeta.team1.flagUrl) document.getElementById('t1Flag').src = d.team1Flag || matchMeta.team1.flagUrl;
    document.getElementById('t1Score').innerText = d.team1Score;
    document.getElementById('t2Code').innerText = d.team2Name || matchMeta.team2.name;
    if(d.team2Flag || matchMeta.team2.flagUrl) document.getElementById('t2Flag').src = d.team2Flag || matchMeta.team2.flagUrl;
    document.getElementById('centerMidCommentary').innerText = d.commentary;
    document.getElementById('valOvers').innerText = d.currentOver;
    document.getElementById('valBalls').innerText = d.currentBall;
    document.getElementById('b1Name').innerText = d.batsman1.name || 'Batter 1';
    document.getElementById('b1Runs').innerText = d.batsman1.runs;
    document.getElementById('b1Balls').innerText = d.batsman1.balls;
    document.getElementById('b14s').innerText = d.batsman1.fours;
    document.getElementById('b16s').innerText = d.batsman1.sixes;
    document.getElementById('b1Sr').innerText = d.batsman1.sr;
    if(d.batsman1.vector) document.getElementById('b1Img').src = d.batsman1.vector;
    if(d.batsman1.jersey) document.getElementById('b1Jersey').src = d.batsman1.jersey;
    document.getElementById('b2Name').innerText = d.batsman2.name || 'Batter 2';
    document.getElementById('b2Runs').innerText = d.batsman2.runs;
    document.getElementById('b2Balls').innerText = d.batsman2.balls;
    document.getElementById('b24s').innerText = d.batsman2.fours;
    document.getElementById('b26s').innerText = d.batsman2.sixes;
    document.getElementById('b2Sr').innerText = d.batsman2.sr;
    if(d.batsman2.vector) document.getElementById('b2Img').src = d.batsman2.vector;
    if(d.batsman2.jersey) document.getElementById('b2Jersey').src = d.batsman2.jersey;
    document.getElementById('bowlName').innerText = d.bowler.name || 'Bowler';
    document.getElementById('bowlFigs').innerText = d.bowler.figures;
    document.getElementById('bowlOvs').innerText = d.bowler.overs;
    document.getElementById('bowlEcon').innerText = d.bowler.econ;
    if(d.bowler.vector) document.getElementById('bowlImg').src = d.bowler.vector;
    if(d.bowler.jersey) document.getElementById('bowlJersey').src = d.bowler.jersey;
}
// Auto fetch every 3 seconds from Cloudflare/GitHub JSON (no puppeteer needed in browser)
setInterval(fetchLiveData, 3000);
fetchLiveData();
// Switch matches with keyboard (for YT multi-match)
document.addEventListener('keydown', (e) => {
    if (!liveData || !liveData.matches) return;
    if (e.key === 'ArrowRight') {
        currentMatchIndex = (currentMatchIndex + 1) % liveData.matches.length;
        updateUI(liveData.matches[currentMatchIndex].live, liveData.matches[currentMatchIndex]);
    }
    if (e.key === 'ArrowLeft') {
        currentMatchIndex = (currentMatchIndex - 1 + liveData.matches.length) % liveData.matches.length;
        updateUI(liveData.matches[currentMatchIndex].live, liveData.matches[currentMatchIndex]);
    }
});
</script>
</body>
</html>
